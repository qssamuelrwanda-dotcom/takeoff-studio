<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Takeoff Studio</title>
<meta name="description" content="Model buildings or trace PDF drawings, see them in 3D, and generate an NRM-style Bill of Quantities.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js"></script>
<style>
html{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<style>
:root{
  --scheme:light;
  --bg:#E9EDEB; --paper:#F7F9F8; --surface:#FFFFFF; --surface2:#F1F4F2;
  --ink:#16201D; --ink2:#4B5853; --ink3:#7A8782; --line:#D2D9D5; --line2:#E3E8E5;
  --grid:#E4E9E6; --grid2:#CFD7D3;
  --accent:#0F6B63; --accent-soft:#D7EBE8; --on-accent:#FFFFFF;
  --mark:#C98A0B; --mark-soft:#FBEFD2; --danger:#B3261E; --ok:#2E7D4F;
  --f-ui:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark; --scheme:dark;
    --bg:#101614; --paper:#0B100E; --surface:#17201D; --surface2:#1C2623;
    --ink:#E3EAE6; --ink2:#A3AFAA; --ink3:#72807A; --line:#2B3632; --line2:#222C29;
    --grid:#161E1B; --grid2:#243029;
    --accent:#45B5A8; --accent-soft:#16332F; --on-accent:#06110F;
    --mark:#F0B429; --mark-soft:#3A2E12; --danger:#F2766B; --ok:#5CC08A;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark; --scheme:dark;
  --bg:#101614; --paper:#0B100E; --surface:#17201D; --surface2:#1C2623;
  --ink:#E3EAE6; --ink2:#A3AFAA; --ink3:#72807A; --line:#2B3632; --line2:#222C29;
  --grid:#161E1B; --grid2:#243029;
  --accent:#45B5A8; --accent-soft:#16332F; --on-accent:#06110F;
  --mark:#F0B429; --mark-soft:#3A2E12; --danger:#F2766B; --ok:#5CC08A;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;overflow:hidden}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

#app{height:100%;display:grid;grid-template-columns:92px minmax(0,1fr) 312px;grid-template-rows:auto minmax(0,1fr) 30px;grid-template-areas:"top top top" "rail stage side" "status status status"}
#app.boq-mode{grid-template-columns:0 minmax(0,1fr) 0}
#app.boq-mode .rail,#app.boq-mode .side{display:none}

/* top bar */
.top{grid-area:top;display:flex;align-items:center;gap:14px;padding:9px 14px 8px;background:linear-gradient(100deg,color-mix(in srgb,var(--accent) 10%,var(--surface)) 0%,var(--surface) 45%,color-mix(in srgb,#C07E14 6%,var(--surface)) 100%);border-bottom:1px solid var(--line);flex-wrap:wrap;min-height:54px;position:relative}
.top::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,#0F7A70,#2F6FB8 22%,#8150C0 42%,#C4523B 62%,#C07E14 80%,#2E9460)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:28px;height:28px;flex:none;color:var(--accent)}
.brand .wordmark{font-family:var(--f-cond);font-weight:700;font-size:17px;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap}
.brand input{border:1px solid transparent;background:transparent;border-radius:4px;padding:3px 6px;font-weight:500;width:230px;max-width:40vw;color:var(--ink2)}
.brand input:hover,.brand input:focus{border-color:var(--line);background:var(--surface2)}
.views{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface);padding:3px;gap:2px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.views button{border:0;background:transparent;padding:6px 13px;font-family:var(--f-cond);font-weight:600;font-size:14px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2)}
.views button{border-radius:6px}.views button:hover{background:var(--surface2);color:var(--ink)}
.views button[aria-selected="true"]{background:var(--accent);color:var(--on-accent);box-shadow:0 2px 8px color-mix(in srgb,var(--accent) 40%,transparent)}
.kpis{display:flex;gap:18px;margin-left:auto;align-items:center}
.kpi{display:flex;flex-direction:column;line-height:1.15}
.kpi .k{font-family:var(--f-cond);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.kpi b{font-family:var(--f-mono);font-weight:500;font-size:14px;font-variant-numeric:tabular-nums}
.kpi.main b{color:var(--accent);font-size:16px}
.team{display:flex;align-items:center;gap:8px}.team[hidden]{display:none!important}
@media (max-width:1560px){.brand .wordmark{display:none}.brand input{width:190px}.kpis{gap:12px}.views button{padding:6px 10px}}
.peers{display:flex}.peers img{width:26px;height:26px;border-radius:50%;border:2px solid #888;margin-left:-6px;background:var(--surface);object-fit:cover}.peers img:first-child{margin-left:0}.peers .more{font-size:11px;color:var(--ink3);margin-left:4px;align-self:center}
.tdot{width:8px;height:8px;border-radius:50%;background:var(--ink3);display:inline-block;flex:none}
#bTeam[data-st="synced"] .tdot,.tdot[data-st="synced"]{background:var(--ok)}#bTeam[data-st="pending"] .tdot,#bTeam[data-st="saving"] .tdot,#bTeam[data-st="syncing"] .tdot,.tdot[data-st="pending"],.tdot[data-st="saving"]{background:var(--mark)}
#bTeam[data-st="error"] .tdot,.tdot[data-st="error"]{background:var(--danger)}#bTeam[data-st="view"] .tdot,.tdot[data-st="view"]{background:var(--accent)}
.pj-dlg{width:min(640px,100%)}.pj-top{display:flex;gap:8px;margin:4px 0 10px}.pj-top input{flex:1;min-width:0;padding:7px 10px}
.pj-row{grid-template-columns:minmax(0,1fr) auto}.pj-row .pj-acts{grid-column:1/-1;display:flex;gap:4px;flex-wrap:wrap}.pj-name b{overflow-wrap:anywhere}.pj-name input{width:100%;padding:5px 8px}
.pj-list{max-height:52vh;overflow:auto}.pj-empty{color:var(--ink3);margin:10px 2px}.pj-foot{font-size:12px;color:var(--ink3);margin:10px 0 0}.btn.danger{background:#c2372c;border-color:#c2372c;color:#fff}
.team-dlg{width:min(560px,100%);max-height:86vh;overflow:auto}.tm-status{display:flex;gap:8px;align-items:baseline}.tm-h{font-family:var(--f-cond);font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);margin:12px 0 6px}
.tm-list{display:flex;flex-direction:column;gap:4px}.tm-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px;align-items:center;padding:6px 8px;border:1px solid var(--line2);border-radius:6px}.tm-row.on{border-color:var(--accent);background:var(--accent-soft)}
.tm-row small,.tm-person small{display:block;color:var(--ink3);font-size:11.5px}.tm-people{display:flex;flex-direction:column;gap:6px}.tm-person{display:grid;grid-template-columns:28px minmax(0,1fr);column-gap:8px;align-items:center}.tm-person img{width:28px;height:28px;border-radius:50%;border:2px solid #888;grid-row:span 2}
.actions{display:flex;gap:6px;align-items:center;position:relative}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:6px 10px;display:inline-flex;align-items:center;gap:6px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface2);border-color:var(--ink3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 8px;font-size:13px}
.btn.icon{padding:6px}
.btn:disabled{opacity:.45;cursor:default}
.btn svg{width:16px;height:16px}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:6px;min-width:230px;z-index:40;display:flex;flex-direction:column}
.menu[hidden]{display:none}
.menu button{border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:5px;display:flex;justify-content:space-between;gap:12px}
.menu button:hover{background:var(--surface2)}
.menu button small{color:var(--ink3)}
.menu hr{border:0;border-top:1px solid var(--line2);margin:4px 2px}

/* rail */
.rail{grid-area:rail;background:linear-gradient(180deg,var(--surface),var(--surface2));border-right:1px solid var(--line);display:flex;flex-direction:column;gap:5px;padding:6px 5px 12px;overflow-y:auto;scrollbar-width:thin}
.rgrp{--gc:var(--accent);--gcx:var(--gc);display:flex;flex-direction:column;gap:2px;padding:6px 3px 4px;border-radius:10px;background:color-mix(in srgb,var(--gcx) 8%,var(--surface));border:1px solid color-mix(in srgb,var(--gcx) 16%,transparent)}
.rail .grp{font-family:var(--f-cond);font-size:11.5px;font-weight:700;letter-spacing:0;color:var(--gcx);padding:0 2px 3px;display:block;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail .grp b{display:block;width:fit-content;font-family:var(--f-mono);font-weight:600;font-size:9.5px;letter-spacing:0;color:#fff;background:var(--gcx);border-radius:4px;padding:1px 4px;margin:0 0 2px;text-transform:none}
.rtools{display:flex;flex-direction:column;gap:2px}
.tool{width:100%;min-height:52px;border:1px solid transparent;border-radius:8px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative;color:var(--ink);padding:5px 2px 4px;transition:background .12s,transform .12s}
.tool svg{width:30px;height:30px;padding:4px;flex:none;border-radius:8px;color:var(--gcx);background:color-mix(in srgb,var(--gcx) 15%,var(--surface))}
.tool .tl{font-family:var(--f-cond);font-weight:600;font-size:11.5px;line-height:1;letter-spacing:.02em;white-space:nowrap}
.tool:hover{background:color-mix(in srgb,var(--gcx) 14%,var(--surface))}
.tool:hover svg{transform:translateY(-1px)}
.tool[aria-pressed="true"]{background:var(--gcx);border-color:var(--gcx);color:#fff;box-shadow:0 3px 10px color-mix(in srgb,var(--gcx) 40%,transparent)}
.tool[aria-pressed="true"] svg{color:#fff;background:rgba(255,255,255,.2)}
.tool[aria-pressed="true"]::before{content:"";position:absolute;left:-6px;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--gcx)}
.tool kbd{position:absolute;right:4px;top:3px;font-family:var(--f-mono);font-size:9px;line-height:1;color:var(--ink3);opacity:.8}
.tool[aria-pressed="true"] kbd{color:#fff}
.tool .cnt{position:absolute;left:4px;top:3px;font-style:normal;font-family:var(--f-mono);font-size:9px;line-height:1;min-width:14px;padding:2px 3px;border-radius:7px;background:var(--gcx);color:#fff;text-align:center}
.tool[aria-pressed="true"] .cnt{background:#fff;color:var(--gc)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .rgrp{--gcx:color-mix(in srgb,var(--gc) 72%,#fff)}}
:root[data-theme="dark"] .rgrp{--gcx:color-mix(in srgb,var(--gc) 72%,#fff)}
/* visibility & multi-select */
.eye{border:0;background:transparent;color:var(--ink2);padding:2px;border-radius:5px;display:inline-grid;place-items:center;line-height:0}
.eye:hover{background:var(--surface2);color:var(--ink)}.eye[aria-pressed="false"]{color:var(--ink3)}
.counts.vis{grid-template-columns:22px 1fr auto;align-items:center;margin-top:4px}.counts .off{color:var(--ink3);text-decoration:line-through}.counts small{color:var(--mark);font-size:11px}
.vis-hd{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font:600 11.5px/1 var(--f-cond);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.ms-chips{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 10px}.ms-chip{border:1px solid var(--line);background:var(--surface2);border-radius:14px;padding:3px 10px;font-size:12.5px}.ms-chip b{font-family:var(--f-mono);font-weight:600;margin-left:3px;color:var(--accent)}.ms-chip:hover{border-color:var(--accent)}
.ms-edit{border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:6px;padding:8px 10px;margin-bottom:10px;background:var(--surface2)}
.qa{margin:10px 0;padding:8px 10px;border:1px solid var(--line2);border-radius:8px;background:var(--surface2)}.qa-h{margin:0 0 6px;font-family:var(--f-cond);font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}.qa-row{display:flex;flex-wrap:wrap;gap:5px}.qa-b b{font-family:var(--f-mono);margin-left:3px;color:var(--accent)}
.ms-move{display:flex;align-items:center;gap:6px;margin-top:8px}.ms-move input{width:70px;padding:4px 6px;font-family:var(--f-mono);font-size:12.5px}.ms-move select{flex:1;padding:4px}
.cm-ctl{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;margin-left:6px;padding:3px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}.cm-tog{display:inline-flex;align-items:center;gap:5px;font-weight:600;font-size:13px;cursor:pointer}
.cm-ctl select,.cm-ctl input{padding:3px 6px;font-size:12.5px}.cm-ctl #cmArea{width:90px;font-family:var(--f-mono)}.cm-ctl #cmLab{width:110px}
.bill td.cm,.bill th.cm{color:var(--ink2);font-family:var(--f-mono);font-size:12.5px;white-space:nowrap;background:color-mix(in srgb,var(--rp,var(--accent)) 5%,transparent)}.bill tr.cm-tot td{font-weight:600}
.coll td.cmv{color:var(--ink2);font-family:var(--f-mono);font-size:12px;text-align:right;padding-left:10px;white-space:nowrap}.coll tr.cm-h td{font-size:11px;color:var(--ink3);text-align:right;padding-bottom:2px}
.xp-bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:8px 0 2px}.xp-bar>span{font-size:12.5px;color:var(--ink3);margin-right:2px}
.pdf-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0 12px}.pdf-opt{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:7px;cursor:pointer}.pdf-opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}.pdf-opt small{display:block;color:var(--ink3);font-size:12px}.pdf-opt input{margin-top:3px}
.pdf-row{display:flex;gap:14px;align-items:center;margin:8px 0;flex-wrap:wrap}.pdf-row>span{min-width:52px;color:var(--ink2);font-size:13px}.pdf-row label{display:inline-flex;gap:5px;align-items:center}
@media (max-width:560px){.pdf-grid{grid-template-columns:1fr}}
.cdot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;vertical-align:-1px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.ecol{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0;padding:6px 8px;border:1px solid var(--line2);border-radius:6px}.ecol-l{font-size:12.5px;color:var(--ink2)}
.ecol input[type=color],.col-row input[type=color]{width:34px;height:26px;padding:0 2px;border:1px solid var(--line);border-radius:5px;background:var(--surface);cursor:pointer}
.col-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}.col-row{display:flex;align-items:center;gap:10px;padding:6px 8px;border:1px solid var(--line2);border-radius:6px}.col-row span{flex:1;min-width:0}.col-row small{display:block;color:var(--ink3);font-size:11.5px}
.hud-hid[hidden]{display:none!important}.hud-hid{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--mark);color:var(--ink);cursor:pointer}.hud-hid svg{color:var(--mark)}.hud-hid u{color:var(--accent);text-decoration:none;font-weight:600}
.btn svg[viewBox="0 0 20 20"]{width:15px;height:15px}

/* stage */
.stage{grid-area:stage;display:grid;grid-template-columns:1fr 1fr;min-height:0;min-width:0;background:var(--paper)}
.stage[data-view="plan"]{grid-template-columns:1fr}
.stage[data-view="3d"]{grid-template-columns:1fr}
.stage[data-view="boq"]{grid-template-columns:1fr}
.stage[data-view="plan"] #threePane,.stage[data-view="plan"] #boqPane{display:none}
.stage[data-view="3d"] #planPane,.stage[data-view="3d"] #boqPane{display:none}
.stage[data-view="split"] #boqPane{display:none}
.stage[data-view="boq"] #planPane,.stage[data-view="boq"] #threePane{display:none}
.pane{position:relative;min-height:0;min-width:0;overflow:hidden}
#threePane{border-left:1px solid var(--line)}
#plan{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
#plan.sel{cursor:default}
#three{width:100%;height:100%}
#three canvas{display:block}
.hud{position:absolute;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none;right:10px}
.hud>*{pointer-events:auto}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:4px 8px;font-size:12px;display:inline-flex;align-items:center;gap:6px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.chip b{font-family:var(--f-cond);letter-spacing:.05em;text-transform:uppercase;font-size:12px}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.chip.legend{gap:4px;font-family:var(--f-mono);font-size:10.5px}.chip.legend i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-left:4px}
.hud .right{margin-left:auto;display:flex;gap:4px}
.hud label.chip{cursor:pointer}
.pane-title{position:absolute;right:10px;bottom:10px;font-family:var(--f-cond);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);pointer-events:none}
.nolib{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink3);padding:20px;text-align:center}

/* side panel */
.side{grid-area:side;background:var(--surface);border-left:1px solid var(--line);overflow-y:auto;min-height:0}
.panel{border-bottom:1px solid var(--line2);padding:12px 14px 14px}
.panel h3{margin:0 0 10px;padding-left:9px;border-left:3px solid var(--accent);font-family:var(--f-cond);font-weight:600;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);display:flex;align-items:center;justify-content:space-between;gap:8px}
.panel h3 .sub{font-family:var(--f-ui);text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink3);font-size:12px}
.levels{display:flex;flex-direction:column;gap:4px}
.lv{display:grid;grid-template-columns:18px minmax(0,1fr) 48px 48px 22px 20px;gap:4px;align-items:center;padding:3px 4px;border-radius:5px;border:1px solid transparent}
.lv.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.lv input[type=radio]{accent-color:var(--accent);margin:0}
.lv input:not([type]),.lv input[type=text],.lv input[type=number]{width:100%;border:1px solid transparent;background:transparent;border-radius:4px;padding:3px 4px;min-width:0}
.lv input[type=number]{font-family:var(--f-mono);font-size:12px;text-align:right}
.lv input:hover,.lv input:focus{border-color:var(--line);background:var(--surface)}
.lv .x{border:0;background:transparent;color:var(--ink3);border-radius:4px;height:24px}
.lv .x:hover{color:var(--danger);background:var(--surface2)}
.lvhead{display:grid;grid-template-columns:18px minmax(0,1fr) 48px 48px 22px 20px;gap:4px;font-size:11px;color:var(--ink3);padding:0 4px 2px;text-align:right}
.lvhead span:nth-child(2){text-align:left}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field.wide{grid-column:1/-1}
.field label{font-size:11.5px;color:var(--ink3)}
.field input,.field select{border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:5px 7px;width:100%;min-width:0}
.field input[type=number]{font-family:var(--f-mono);font-size:13px}
.unitwrap{position:relative}
.unitwrap span{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--ink3);pointer-events:none;font-family:var(--f-mono)}
.unitwrap input{padding-right:24px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.seg button{border:0;background:transparent;padding:4px 10px;font-size:12.5px;color:var(--ink2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.qty{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:10px}
.qty td{padding:5px 0;border-top:1px solid var(--line2);vertical-align:top}
.qty td.n{text-align:right;font-family:var(--f-mono);white-space:nowrap;padding-left:8px}
.sets{display:flex;flex-direction:column;gap:5px}
.set{display:grid;grid-template-columns:20px minmax(0,1fr) minmax(0,1fr) 24px;gap:5px;align-items:center}
.set.lk{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 24px;padding-bottom:6px;border-bottom:1px solid var(--line2)}
.set.lk [data-f="t"]{grid-area:1/1/2/3}.set.lk .x{grid-area:1/3}.set.lk [data-f="d"]{grid-area:2/1}.set.lk .unitwrap{grid-area:2/2}
.set.lk .unitwrap input{padding-right:46px}
.set.bs,.set.bl{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 24px;padding-bottom:6px;border-bottom:1px solid var(--line2)}
.set.bl{grid-template-columns:62px minmax(0,1fr) minmax(0,1fr) 24px}
.set.bs [data-f="pos"]{grid-area:1/1/2/3}.set.bs .x{grid-area:1/3}
.set.bl [data-f="t"]{grid-area:1/1/2/4}.set.bl .x{grid-area:1/4}
.set.bl .unitwrap input{padding-right:34px}
.set .tag{font-family:var(--f-mono);font-size:11px;color:var(--ink3);text-align:center}
.set input,.set select{border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:5px 6px;width:100%;min-width:0;font-size:13px}
.set input{font-family:var(--f-mono)}
.set .x{border:0;background:transparent;color:var(--ink3);border-radius:4px;height:26px}
.set .x:hover:not(:disabled){color:var(--danger);background:var(--surface2)}
.set .x:disabled{opacity:.3}
.addset{align-self:flex-start;margin-top:2px}
.corners{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.corners h4{margin:0 0 6px;font-family:var(--f-cond);font-weight:600;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);display:flex;justify-content:space-between}
.corners h4 span{font-family:var(--f-ui);text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink3)}
.crow{display:grid;grid-template-columns:52px minmax(0,1fr) minmax(0,1fr) 24px;gap:5px;align-items:center;margin-bottom:4px;border-radius:5px;padding:1px 2px}
.crow.on{background:var(--mark-soft)}
.crow span:first-child{font-family:var(--f-mono);font-size:11.5px;color:var(--ink3)}
.crow input{border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:4px 6px;width:100%;min-width:0;font-family:var(--f-mono);font-size:12.5px}
.crow .x{border:0;background:transparent;color:var(--ink3);border-radius:4px;height:24px}
.crow .x:hover:not(:disabled){color:var(--danger);background:var(--surface2)}.crow .x:disabled{opacity:.3}
.rebar{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.rebar h4{margin:0 0 8px;font-family:var(--f-cond);font-weight:600;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.qty.bars thead td{color:var(--ink3);font-size:11px;border-top:0;padding-bottom:2px}
.qty td.u{color:var(--ink3);width:28px;padding-left:4px;font-size:11.5px}
.hint{color:var(--ink3);font-size:12.5px;line-height:1.5;margin:6px 0 0}
.hint kbd,.status kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 4px;background:var(--surface2);color:var(--ink2)}
.drop{border:1.5px dashed var(--line);border-radius:7px;padding:14px;text-align:center;color:var(--ink3);font-size:12.5px;line-height:1.45}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop .btn{margin-top:8px}
input[type=range]{accent-color:var(--accent);width:100%}
.badge{display:inline-block;font-family:var(--f-cond);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:1px 6px;border-radius:3px;background:var(--surface2);border:1px solid var(--line);color:var(--ink2)}
.counts{display:grid;grid-template-columns:1fr auto;gap:3px 12px;font-size:12.5px;margin-top:8px}
.counts:not(.vis) span:nth-child(even),.counts .vc{font-family:var(--f-mono);text-align:right}.counts.vis{gap:1px 8px}

/* status */
.status{grid-area:status;display:flex;align-items:center;gap:14px;padding:0 12px;background:var(--surface);border-top:1px solid var(--line);font-size:12px;color:var(--ink2);white-space:nowrap;overflow-x:auto}
.status .coords{font-family:var(--f-mono);min-width:170px}
.curve-box{border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin:8px 0 10px;background:var(--surface2)}
.curve-hd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;font:600 12px/1 "Barlow Condensed",sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.qg-axis{border:1px solid var(--line);border-left:3px solid var(--mark);border-radius:6px;padding:8px 10px 2px;margin:0 0 10px}
.qg-axis .fields{grid-template-columns:1fr 84px}
.qg-ax{display:flex;align-items:center;gap:8px;font:600 12px/1 "Barlow Condensed",sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin-bottom:6px}
.qg-tag{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--mark);color:var(--paper);font-size:12px}
.qg-sum{font-size:12.5px;background:var(--surface2);border-radius:6px;padding:8px 10px;margin:4px 0 10px;line-height:1.5}
.status .hintline{overflow:hidden;text-overflow:ellipsis;flex:1;min-width:120px}
.status .buf{font-family:var(--f-mono);color:var(--mark);font-weight:500}
.tog{border:1px solid var(--line);background:transparent;border-radius:4px;padding:1px 7px;font-size:11.5px;color:var(--ink3)}
.tog[aria-pressed="true"]{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.status select{border:1px solid var(--line);background:var(--surface);border-radius:4px;font-size:11.5px;padding:1px 3px}

<script>
(()=>{
'use strict';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=>Math.random().toString(36).slice(2,10);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mm=v=>Math.round(+v*1000);
const d2=(a,b)=>Math.hypot(b[0]-a[0],b[1]-a[1]);
const STORE='takeoffstudio.project.v1';

/* ---------- geometry ---------- */
function area(p){let s=0;for(let i=0;i<p.length;i++){const a=p[i],b=p[(i+1)%p.length];s+=a[0]*b[1]-b[0]*a[1];}return Math.abs(s)/2;}
function perim(p){let s=0;for(let i=0;i<p.length;i++)s+=d2(p[i],p[(i+1)%p.length]);return s;}
function inPoly(pt,p){let c=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const xi=p[i][0],yi=p[i][1],xj=p[j][0],yj=p[j][1];if(((yi>pt[1])!==(yj>pt[1]))&&(pt[0]<(xj-xi)*(pt[1]-yi)/(yj-yi)+xi))c=!c;}return c;}
function projSeg(p,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],L2=dx*dx+dy*dy||1e-9;let t=((p[0]-a[0])*dx+(p[1]-a[1])*dy)/L2;t=clamp(t,0,1);const q=[a[0]+t*dx,a[1]+t*dy];return{t,q,d:d2(p,q),L:Math.sqrt(L2)};}

/* ---------- curved (arc) line elements: chord a→b plus signed bulge e.arc (sagitta, m) ---------- */
const ARCT=['wall','fwall','strip','beam','gbeam','cwall','louvre','rail'];
function arcOf(e){const sg=+(e&&e.arc)||0;if(!e||!e.pts||e.pts.length<2||Math.abs(sg)<1e-3||!ARCT.includes(e.type))return null;const [a,b]=e.pts;const c=d2(a,b);if(c<1e-6)return null;
  const ux=(b[0]-a[0])/c,uy=(b[1]-a[1])/c,nx=-uy,ny=ux,m=[(a[0]+b[0])/2,(a[1]+b[1])/2];const R=(c*c/4+sg*sg)/(2*Math.abs(sg));const M=[m[0]+nx*sg,m[1]+ny*sg];const sn=Math.sign(sg);const C=[M[0]-nx*sn*R,M[1]-ny*sn*R];
  const fa=Math.atan2(a[1]-C[1],a[0]-C[0]),fm=Math.atan2(M[1]-C[1],M[0]-C[0]);let d=fm-fa;while(d>Math.PI)d-=2*Math.PI;while(d<=-Math.PI)d+=2*Math.PI;const D=2*d;return{C,R,fa,D,L:R*Math.abs(D),s:sg,M,c};}
function elLen(e){const A=arcOf(e);return A?A.L:d2(e.pts[0],e.pts[1]);}
function frameAt(e,dist){const A=arcOf(e);const [a,b]=e.pts;
  if(!A){const L=d2(a,b)||1e-9;const u=[(b[0]-a[0])/L,(b[1]-a[1])/L];return{p:[a[0]+u[0]*dist,a[1]+u[1]*dist],u,n:[-u[1],u[0]]};}
  const f=A.fa+A.D*dist/A.L,sd=Math.sign(A.D);const u=[-Math.sin(f)*sd,Math.cos(f)*sd];return{p:[A.C[0]+A.R*Math.cos(f),A.C[1]+A.R*Math.sin(f)],u,n:[-u[1],u[0]]};}
function projEl(pt,e){const A=arcOf(e);if(!A)return projSeg(pt,e.pts[0],e.pts[1]);
  const fp=Math.atan2(pt[1]-A.C[1],pt[0]-A.C[0]);let dl=(fp-A.fa)*Math.sign(A.D);dl=((dl%(2*Math.PI))+2*Math.PI)%(2*Math.PI);const span=Math.abs(A.D);
  let t=dl/span;if(t>1)t=(dl-span)<(2*Math.PI-dl)?1:0;const q=frameAt(e,t*A.L).p;return{t,q,d:d2(pt,q),L:A.L};}
function elQuad(e,w,ext=true){const A=arcOf(e);if(!A)return wallQuad(e.pts[0],e.pts[1],w,ext);const x=ext?w/2:0;const n=Math.max(6,Math.ceil(Math.abs(A.D)/(Math.PI/48)));const Lf=[],Rt=[];
  for(let i=0;i<=n;i++){const f=frameAt(e,-x+(A.L+2*x)*i/n);Lf.push([f.p[0]+f.n[0]*w/2,f.p[1]+f.n[1]*w/2]);Rt.push([f.p[0]-f.n[0]*w/2,f.p[1]-f.n[1]*w/2]);}return[...Lf,...Rt.reverse()];}
function alongSegs(e,s0,s1,wd){const A=arcOf(e);if(!A){const f=frameAt(e,(s0+s1)/2);return[{len:s1-s0,c:f.p,rot:-Math.atan2(f.u[1],f.u[0])}];}
  const span=(s1-s0)/A.R;const n=Math.max(1,Math.ceil(Math.abs(span)/(Math.PI/30)));const out=[];
  for(let i=0;i<n;i++){const a=s0+(s1-s0)*i/n,b=s0+(s1-s0)*(i+1)/n;const f=frameAt(e,(a+b)/2);const dphi=(b-a)/A.R;out.push({len:2*(A.R+(wd||0)/2)*Math.sin(dphi/2)+0.002,c:f.p,rot:-Math.atan2(f.u[1],f.u[0])});}return out;}
function bandPts(e,s0,s1,w){const A=arcOf(e);const n=A?Math.max(2,Math.ceil(Math.abs(s1-s0)/A.R/(Math.PI/60))):1;const Lf=[],Rt=[];
  for(let i=0;i<=n;i++){const f=frameAt(e,s0+(s1-s0)*i/n);Lf.push([f.p[0]+f.n[0]*w/2,f.p[1]+f.n[1]*w/2]);Rt.push([f.p[0]-f.n[0]*w/2,f.p[1]-f.n[1]*w/2]);}return[...Lf,...Rt.reverse()];}
function sagFrom3(a,b,p){const c=d2(a,b);if(c<1e-6)return 0;const u=[(b[0]-a[0])/c,(b[1]-a[1])/c],n=[-u[1],u[0]],m=[(a[0]+b[0])/2,(a[1]+b[1])/2];const x=(p[0]-m[0])*u[0]+(p[1]-m[1])*u[1],y=(p[0]-m[0])*n[0]+(p[1]-m[1])*n[1];
  if(Math.abs(y)<0.01)return 0;const k=(x*x+y*y-c*c/4)/(2*y);const R=Math.sqrt(c*c/4+k*k);return +(k+Math.sign(y)*R).toFixed(3);}
function sagFromR(c,R,side){if(!(R>0))return 0;R=Math.max(R,c/2);return +(Math.sign(side||1)*(R-Math.sqrt(Math.max(0,R*R-c*c/4)))).toFixed(3);}
function bendFrom(e,p){const [a,b]=e.pts;const c=d2(a,b)||1e-9;const n=[-(b[1]-a[1])/c,(b[0]-a[0])/c],m=[(a[0]+b[0])/2,(a[1]+b[1])/2];const y=(p[0]-m[0])*n[0]+(p[1]-m[1])*n[1];return Math.abs(y)<0.02?0:+y.toFixed(3);}
function bbox(p){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const [x,y] of p){x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y);}return{x0,y0,x1,y1,w:x1-x0,h:y1-y0};}

/* ---------- measurement rules ---------- */
const voidCounts=v=>v.p.rule==='always'||area(v.pts)>1.0+1e-9;
function voidsIn(e,forRooms){return onLevel(e.level).filter(v=>v.type==='void'&&v.pts?.length>=3&&voidCounts(v)&&(!forRooms||v.p.vrooms!=='no')&&inPoly(centroid(v.pts),e.pts));}
function netArea(e){const vs=voidsIn(e,e.type==='room');return Math.max(0,area(e.pts)-vs.reduce((s,v)=>s+area(v.pts),0));}
function hostSlab(v){return onLevel(v.level).filter(x=>x.type==='slab'&&inPoly(centroid(v.pts),x.pts)).sort((a,b)=>area(a.pts)-area(b.pts))[0]||null;}
function distToPoly(pt,poly){let d=1e9;for(let i=0;i<poly.length;i++)d=Math.min(d,projSeg(pt,poly[i],poly[(i+1)%poly.length]).d);return d;}
function roomH(e){if(+e.p.ch>0)return +e.p.ch;const l=lvl(e.level);return Math.max(0,(+l?.h||3)-slabAboveT(e.level));}
function roomOpenings(e){const out=[];for(const o of onLevel(e.level)){if(!o.host)continue;const w=byId(o.host);if(!w)continue;const [a,b]=w.pts;const L=d2(a,b)||1e-9;
  const c=[a[0]+(b[0]-a[0])/L*o.at,a[1]+(b[1]-a[1])/L*o.at];if(distToPoly(c,e.pts)<+w.p.t/2+0.06)out.push(o);}return out;}
const opOn=(ops,y0,y1)=>ops.reduce((s,o)=>{if(o.p.w*o.p.h<=1+1e-9)return s;const sill=o.type==='door'?0:+o.p.sill;const top=sill+ +o.p.h;return s+o.p.w*Math.max(0,Math.min(top,y1)-Math.max(sill,y0));},0);
function roomQ(e){const A=netArea(e),Pm=perim(e.pts),H=roomH(e),ops=roomOpenings(e);const doorW=ops.filter(o=>o.type==='door').reduce((s,o)=>s+ +o.p.w,0);
  const gross=Pm*H,net=Math.max(0,gross-opOn(ops,0,H));const th=Math.min(H,+e.p.wt||0);

function takeoff(){

  const secs=SEC.map(([code,name])=>({code,name,items:[],total:0}));

  let works=0;
  for(const s of secs){s.items.sort((a,b)=>a.o-b.o||a.key.localeCompare(b.key,undefined,{numeric:true}));
    s.items.forEach((it,i)=>{it.ref=s.code+'.'+String(i+1).padStart(2,'0');it.q=roundQ(it.qty,it.unit);it.r=rateOf(it);it.amt=it.q*it.r;s.total+=it.amt;});works+=s.total;}

function rebarSchedule(){

    rows.push({head:true,ref,id:e.id,title:TYPES[e.type].label,level:l.name,dims:elemDims(e)});

function csvParse(t){const rows=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){f+='"';i++;}else q=false;}else f+=ch;}else if(ch==='"')q=true;else if(ch===','||ch===';'){row.push(f);f='';}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f='';}else f+=ch;}if(f||row.length){row.push(f);rows.push(row);}return rows.filter(r=>r.some(x=>x.trim()!==''));}

      <tr class="item"><td class="ref">2.5.01</td><td class="desc">Hollow concrete blockwork 200 mm thick</td><td class="unit">m²</td><td class="q r">210.40</td><td class="amt r">46.00</td><td class="amt r">9,678.40</td></tr>
      <tr class="item"><td class="ref">2.5.02</td><td class="desc">Precast concrete lintel 200 mm wide</td><td class="unit">m</td><td class="q r">20.50</td><td class="amt r">45.00</td><td class="amt r">922.50</td></tr>
      <tr class="item"><td class="ref">2.5.03</td><td class="desc">15 mm two-coat render to external walls</td><td class="unit">m²</td><td class="q r">198.20</td><td class="amt r">24.00</td><td class="amt r">4,756.80</td></tr>
      <tr class="sub"><td></td><td colspan="4">Total carried to collection</td><td class="amt r">15,357.70</td></tr></tbody></table>
      <table class="coll" style="margin-top:12px;max-width:340px"><tbody><tr class="grand"><td>Total incl. VAT</td><td>${money(TO.total)}</td></tr></tbody></table></div>`,'Reports, the cover page and its chart use these settings. Excel exports keep plain formatting.');}
  case'bank':return bankHTML();
  case'team':return card('Team &amp; sharing',`<div class="tm-body">${teamDialogBody()}</div>`);
  case'files':return card('This project',`<div class="file-grid"><button class="btn" data-fact="save">Save project file (.json)</button><button class="btn" data-fact="open">Open project file…</button><button class="btn primary needs-dl" data-fact="xlsx">Export all reports to Excel</button><button class="btn needs-dl" data-fact="csv">Export BoQ as CSV</button><button class="btn" data-fact="copy">Copy BoQ to clipboard</button></div>`,'Project files hold the model, rates, data bank, rate analyses and cover. PDF drawings are not included.')+
    card('Projects',`<div class="file-grid"><button class="btn primary" data-fact="projects">My projects…</button><button class="btn" data-fact="new">New empty project</button><button class="btn" data-fact="sample">Load sample house</button></div>`,'Every project is saved automatically in this browser. New projects never replace old ones; find them all under My projects.');}
  return'';}
function renderSettings(){
  const pane=$('#boqPane');const sig=focusSig(document.activeElement);const sc=pane.scrollTop;const id=SETT[S.set]?S.set:'general';S.set=id;
  pane.innerHTML=`<div class="rep"><nav class="side-nav" aria-label="Project settings">${SETNAV.map(([g,ls])=>`<div class="sn-grp"><span>${g}</span>${ls.map(([k,n])=>`<button data-set="${k}" aria-current="${id===k?'page':'false'}">${n}</button>`).join('')}</div>`).join('')}<div class="sn-foot"><button class="linkbtn" data-gorep="bill">Open reports →</button></div></nav>
    <div ${repAttrs()}><div class="boq-head"><div><h1>${SETT[id]}</h1><p>Project settings · ${esc(P.name)}</p></div></div><div class="set-body${['bank','cover'].includes(id)?' wide':''}">${settingsBody(id)}</div></div></div>`;
  pane.scrollTop=sc;
  pane.querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>{S.set=b.dataset.set;try{localStorage.setItem('takeoffstudio.set',S.set);}catch(e){}pane.scrollTop=0;renderSettings();});
  pane.querySelectorAll('[data-gorep]').forEach(b=>b.onclick=()=>{S.boqTab=b.dataset.gorep;setView('boq');});
  const on=(sel,ev,fn)=>{const e=pane.querySelector(sel);if(e)e[ev]=fn;};
  on('#stName','onchange',e=>mutate(()=>P.name=e.target.value||'Untitled project'));
  on('#cur','onchange',e=>mutate(()=>P.currency=e.target.value));
  on('#fac','onchange',e=>mutate(()=>P.factor=Math.max(0,parseFloat(e.target.value)||1)));
  on('#rReset','onclick',()=>mutate(()=>P.rates={}));
  on('#pPre','onchange',e=>mutate(()=>P.prelims=parseFloat(e.target.value)||0));
  on('#pCon','onchange',e=>mutate(()=>P.contingency=parseFloat(e.target.value)||0));
  on('#pVat','onchange',e=>mutate(()=>P.vat=parseFloat(e.target.value)||0));
  pane.querySelectorAll('[data-slv]').forEach(i=>i.addEventListener('change',()=>{const l=lvl(i.dataset.slv),f=i.dataset.f;mutate(()=>{l[f]=f==='name'?i.value:(parseFloat(i.value)||0);});}));
  pane.querySelectorAll('[data-slvdel]').forEach(b=>b.onclick=()=>{const idl=b.dataset.slvdel;if(P.levels.length<2){toast('A project needs at least one level.');return;}const l=lvl(idl);confirmBox(`Delete ${l.name}?`,`This removes the level and its ${onLevel(idl).length} elements.`,'Delete level',()=>mutate(()=>{P.levels=P.levels.filter(x=>x.id!==idl);const gone=new Set(onLevel(idl).map(x=>x.id));P.elements=P.elements.filter(x=>x.level!==idl&&!gone.has(x.host));delete UL[idl];fixState();}));});
  on('#stAddLevel','onclick',()=>$('#addLevel').click());
  pane.querySelectorAll('[data-stp]').forEach(b=>b.onclick=()=>mutate(()=>{const k=b.dataset.stp;P.style.theme=k;if(STYLEP[k]){P.style.primary=STYLEP[k][1];P.style.secondary=STYLEP[k][2];}}));
  const sp=pane.querySelector('#stPri'),ss2=pane.querySelector('#stSec');if(sp)sp.onchange=()=>mutate(()=>{P.style.primary=sp.value;P.style.theme='custom';});if(ss2)ss2.onchange=()=>mutate(()=>{P.style.secondary=ss2.value;P.style.theme='custom';});
  pane.querySelectorAll('[data-sty]').forEach(i=>i.onchange=()=>mutate(()=>{P.style[i.dataset.sty]=i.value;}));
  wireSub(pane);wireFinMode(pane);wirePipeFit(pane);wireCover(pane);wireBank(pane);wireGrids(pane);wireColors(pane);
  const tb=pane.querySelector('.tm-body');if(tb)wireTeamBody(tb);
  pane.querySelectorAll('[data-fact]').forEach(b=>b.onclick=()=>{const m=document.querySelector(`#fileMenu [data-act="${b.dataset.fact}"]`);if(m)m.click();});
  applyDL();
  if(sig){const f=pane.querySelector(sig);if(f){f.focus();if(f.tagName==='INPUT'&&(f.type==='text'||!f.type)){try{const n=f.value.length;f.setSelectionRange(n,n);}catch(e){}}}}
}

/* ---------- boot ---------- */
readTheme();
const mq=matchMedia('(prefers-color-scheme: dark)');const retheme=()=>{readTheme();drawPlan();queue3D();};
mq.addEventListener?.('change',retheme);new MutationObserver(retheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
try{S.bomGroup=localStorage.getItem('takeoffstudio.bomg')||'cat';S.boqTab=localStorage.getItem('takeoffstudio.rep')||'bill';S.set=localStorage.getItem('takeoffstudio.set')||'general';}catch(e){S.bomGroup='cat';S.boqTab='bill';S.set='general';}
renderRail();syncToggles();updateHint();init3D();
libInit();
let v0='split';try{v0=localStorage.getItem('takeoffstudio.view')||'split';}catch(e){}
if(matchMedia('(max-width:900px)').matches&&v0==='split')v0='plan';
setView(v0);
new ResizeObserver(()=>drawPlanNow()).observe($('#planPane'));
initTeam();
/* ---------- update notice (hosted copies: compares with version.json next to the page) ---------- */
const APP_VER='2026.09.26-stairs';
(function(){if(!/^https?:$/.test(location.protocol))return;let shown=false;
  const check=()=>{if(shown)return;fetch('version.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(v=>{if(!v||!v.version||v.version===APP_VER)return;shown=true;
    const b=document.createElement('div');b.className='upd-bar';b.setAttribute('role','status');b.innerHTML=`<span>A new version of Takeoff Studio is available${v.notes?': '+esc(v.notes):'.'}</span><button class="btn sm primary" data-r>Reload now</button><button class="btn sm" data-l>Later</button>`;
    b.querySelector('[data-r]').onclick=()=>{clearTimeout(saveT);libSave();location.reload();};b.querySelector('[data-l]').onclick=()=>b.remove();document.body.appendChild(b);}).catch(()=>{});};
  setTimeout(check,4000);setInterval(check,10*60*1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)check();});})();
})();
</script>
</body>
